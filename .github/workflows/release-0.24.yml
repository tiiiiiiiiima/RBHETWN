name: Build and verify Bakugan 0.24 on Windows
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      zip_sha256: ${{ steps.build.outputs.zip_sha256 }}
    env:
      GH_TOKEN: ${{ github.token }}
      PCK_SHA256: 88daa491e8ccfcbb235115abcb25dd6e4857e310719f475c116712c9af80585f
    steps:
    - uses: actions/checkout@v4
    - name: Download the pinned prior release as assembly input
      shell: bash
      run: |
        mkdir base
        gh release download v0.23.0 --repo "$GITHUB_REPOSITORY" --pattern 'Bakugan-0.23-Windows.zip' --dir base
        python - <<'PYCODE'
        import hashlib, zipfile, shutil
        from pathlib import Path
        p=Path('base/Bakugan-0.23-Windows.zip')
        with p.open('rb') as f: assert hashlib.file_digest(f,'sha256').hexdigest()=='ed20a010498243601b03464b5ea5530b623047bafa2a6e52e1a0db0c5d897b2f'
        with zipfile.ZipFile(p) as z:
            for name, target in [('BakuganPrototype-Windows.pck','base/arena.pck'),('BakuganPrototype-Windows.exe','base/engine.exe')]:
                entry='Bakugan-0.23-Windows/'+name
                with z.open(entry) as source, open(target,'wb') as output: shutil.copyfileobj(source,output,1024*1024)
        PYCODE
    - name: Reassemble the exact tested game PCK
      shell: bash
      run: |
        python qa/release-0.24/pck_delta.py apply --base base/arena.pck --transfer qa/release-0.24 --target release/Bakugan-0.24-Windows/BakuganPrototype-Windows.pck
    - name: Package and verify the standalone Windows ZIP
      id: build
      shell: bash
      run: |
        python - <<'PYCODE'
        from pathlib import Path, PurePosixPath
        import json, hashlib, os, zipfile, shutil
        root=Path('release/Bakugan-0.24-Windows'); meta=Path('qa/release-0.24'); m=json.loads((meta/'manifest.json').read_text())
        def sha(p):
            with p.open('rb') as f: return hashlib.file_digest(f,'sha256').hexdigest()
        assert m['target_sha256']==os.environ['PCK_SHA256'] and sha(root/'BakuganPrototype-Windows.pck')==os.environ['PCK_SHA256']
        assert sha(meta/'documents.zip')==m['documents_sha256']
        with zipfile.ZipFile(meta/'documents.zip') as z:
            for name in z.namelist():
                p=PurePosixPath(name)
                assert not p.is_absolute() and '..' not in p.parts and p.parts[0]==root.name
                assert p.suffix.lower() not in ['.exe','.pck','.cmd','.bat','.ps1','.nds','.iso']
            z.extractall('release')
        shutil.copyfile('base/engine.exe',root/'BakuganPrototype-Windows.exe')
        assert sha(root/'BakuganPrototype-Windows.exe')=='ef90e929ba1a6a4322860285d97f40f4aa349c90329a91b0e8b55b8df0f4cb00'
        assert set(p.name for p in root.iterdir())==set(m['package_files'])
        archive=Path('Bakugan-0.24-Windows.zip')
        with zipfile.ZipFile(archive,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for name in m['package_files']: z.write(root/name,root.name+'/'+name)
        assert archive.stat().st_size<2*1024**3
        with zipfile.ZipFile(archive) as z:
            assert z.testzip() is None and len(z.namelist())==len(m['package_files'])
        value=sha(archive)
        Path('Bakugan-0.24-Windows.sha256').write_text(value+'  '+archive.name+'\n')
        report={'version':'0.24.0','archive_bytes':archive.stat().st_size,'archive_sha256':value,'pck_sha256':m['target_sha256'],'pck_bytes':m['target_bytes'],'engine_sha256':'ef90e929ba1a6a4322860285d97f40f4aa349c90329a91b0e8b55b8df0f4cb00','files':len(m['package_files']),'crc_ok':True,'unchanged_official_engine':True}
        Path('package-report.json').write_text(json.dumps(report,indent=2)+'\n')
        with open(os.environ['GITHUB_OUTPUT'],'a') as output: print('zip_sha256='+value,file=output)
        print(json.dumps(report))
        PYCODE
    - name: Upload only to the prepared draft
      shell: bash
      run: |
        test "$(gh release view v0.24.0 --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
        gh release upload v0.24.0 Bakugan-0.24-Windows.zip Bakugan-0.24-Windows.sha256 package-report.json --repo "$GITHUB_REPOSITORY" --clobber
  windows:
    needs: assemble
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      ANGLE_DEFAULT_PLATFORM: warp
      ZIP_SHA256: ${{ needs.assemble.outputs.zip_sha256 }}
      PCK_SHA256: 88daa491e8ccfcbb235115abcb25dd6e4857e310719f475c116712c9af80585f
    steps:
    - uses: actions/checkout@v4
    - name: Download and verify the complete standalone release
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        New-Item -ItemType Directory -Force reports, package | Out-Null
        gh release download v0.24.0 --repo $env:GITHUB_REPOSITORY --pattern 'Bakugan-0.24-Windows.zip' --dir package
        if ($LASTEXITCODE -ne 0) { throw 'Release download failed' }
        $zip=Join-Path $PWD 'package/Bakugan-0.24-Windows.zip'
        if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() -ne $env:ZIP_SHA256) { throw 'ZIP hash mismatch' }
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        [System.IO.Compression.ZipFile]::ExtractToDirectory($zip,(Join-Path $PWD 'package'))
        $game=Join-Path $PWD 'package/Bakugan-0.24-Windows'
        if ((Get-FileHash (Join-Path $game 'BakuganPrototype-Windows.pck') -Algorithm SHA256).Hash.ToLower() -ne $env:PCK_SHA256) { throw 'PCK hash mismatch' }
        if ((Get-FileHash (Join-Path $game 'BakuganPrototype-Windows.exe') -Algorithm SHA256).Hash.ToLower() -ne 'ef90e929ba1a6a4322860285d97f40f4aa349c90329a91b0e8b55b8df0f4cb00') { throw 'Official EXE mismatch' }
        @{os=[System.Runtime.InteropServices.RuntimeInformation]::OSDescription; zip_sha256=$env:ZIP_SHA256; pck_sha256=$env:PCK_SHA256; renderer='ANGLE/WARP'; physical_gamepad_tested=$false} | ConvertTo-Json | Set-Content reports/execution.json
        "GAME_DIR=$game" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Native resources, slots, prior regressions and controlled balance
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $exe=Join-Path $env:GAME_DIR 'BakuganPrototype-Windows.exe'
        foreach ($test in @(@{script='qa/probe_ds_package.gd';report='resources.json';checks=13293},@{script='qa/test_release22.gd';report='regressions.json';checks=69},@{script='qa/test_release23.gd';report='slots.json';checks=37},@{script='qa/test_release24.gd';report='fields.json';checks=82},@{script='qa/audit_minigame23.gd';report='balance.json';checks=542})) {
          $script=Join-Path $PWD $test.script; $report=Join-Path (Join-Path $PWD 'reports') $test.report
          $p=Start-Process $exe -ArgumentList @('--headless','--audio-driver','Dummy','--script',$script,'--log-file',($report+'.log'),'--',"--report=$report") -WorkingDirectory $env:GAME_DIR -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw "Test timeout: $script" }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $report)) { throw "Test failed: $script" }
          $data=Get-Content $report -Raw | ConvertFrom-Json
          if ($data.failures.Count -ne 0 -or ($test.checks -gt 0 -and $data.checks -ne $test.checks) -or ($test.checks -eq 0 -and $data.checks -lt 13282)) { throw "Assertions failed: $script" }
        }
    - name: Real matches, flight/battle restarts and complete Pyrus match
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $profile=Join-Path $env:APPDATA 'Godot/app_userdata/Bakugan — Arena Prototype/diagnostics/0.24'
        if (Test-Path $profile) { Remove-Item $profile -Recurse -Force }
        $suite=Join-Path $PWD 'reports/matches'; New-Item -ItemType Directory -Force $suite | Out-Null
        $exe=Join-Path $env:GAME_DIR 'BakuganPrototype-Windows.exe'
        $p=Start-Process $exe -ArgumentList @('--rendering-method','gl_compatibility','--rendering-driver','opengl3_angle','--audio-driver','Dummy','--script','res://scripts/release_verifier.gd','--log-file',(Join-Path $suite 'engine-quick.log'),'--','--verify-release',"--report-dir=$suite") -WorkingDirectory $env:GAME_DIR -PassThru
        $deadline=(Get-Date).AddMinutes(20); $summary=Join-Path $suite 'summary.json'; $done=$false
        while ((Get-Date) -lt $deadline) {
          if (Test-Path $summary) {
            try { $data=Get-Content $summary -Raw | ConvertFrom-Json } catch { $data=$null }
            if ($null -ne $data -and $data.in_progress -eq $false) { $done=$true; break }
          }
          foreach ($log in Get-ChildItem $suite -Filter 'engine-*.log') {
            $errorLines=Select-String -Path $log -Pattern 'Failed to create native|SCRIPT ERROR|Parse Error'
            if ($errorLines) { throw ($errorLines.Line -join "`n") }
          }
          if ($p.HasExited -and -not (Test-Path $summary)) { throw 'Suite did not start' }
          Start-Sleep -Seconds 3
        }
        if (-not $done -or $data.passed -ne $true -or $data.os -ne 'Windows' -or $data.version -ne '0.24.0') { throw 'Full Windows suite failed or timed out' }
        foreach ($name in @('quick','loss','save','resume','battle-save','battle-resume','elemental')) {
          $stage=$data.stages.$name
          if ($stage.passed -ne $true -or $stage.run_id -ne $data.run_id -or $stage.metrics.process_memory.available -ne $true) { throw "Invalid stage: $name" }
        }
        if ($data.victory_and_defeat_tested -ne $true -or $data.battle_restart_tested -ne $true -or $data.elemental_field_tested -ne $true) { throw 'Required gameplay coverage missing' }
        if ($data.stages.save.saved.state_digest -ne $data.stages.resume.resumed.state_digest) { throw 'Flight digest mismatch' }
        if ($data.stages.'battle-save'.saved.state_digest -ne $data.stages.'battle-resume'.resumed.state_digest) { throw 'Battle digest mismatch' }
    - name: Attach reports and publish only the successful game release
      shell: pwsh
      run: |
        gh release upload v0.24.0 reports/matches/summary.json reports/execution.json reports/resources.json reports/regressions.json reports/slots.json reports/balance.json reports/fields.json --repo $env:GITHUB_REPOSITORY --clobber
        if ($LASTEXITCODE -ne 0) { throw 'Diagnostics upload failed' }
        gh release edit v0.24.0 --repo $env:GITHUB_REPOSITORY --draft=false
        if ($LASTEXITCODE -ne 0) { throw 'Publication failed' }
    - name: Preserve Windows diagnostics and screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: windows-0.24-${{ github.run_id }}
        path: reports/
        retention-days: 7
'on':
  workflow_dispatch: null
